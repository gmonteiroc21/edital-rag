[project]
name = "edital-rag"
version = "0.1.0"
description = "Assistente de consulta a editais: RAG sobre PDFs com citação obrigatória de seção e página"
authors = [{ name = "Gabriel Monteiro", email = "gmonteirocsousa@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.34,<1.0)",
    "pydantic (>=2.10,<3.0)",
    "pydantic-settings (>=2.7,<3.0)",
    "python-multipart (>=0.0.20,<1.0)",
    "anthropic (>=0.69,<1.0)",
    "fastembed (>=0.5,<1.0)",
    "sqlite-vec (>=0.1.6,<1.0)",
    "pypdf (>=5.1,<6.0)",
    "pdfplumber (>=0.11,<1.0)",
]

[tool.poetry]
packages = [{ include = "edital_rag", from = "src" }]
# Explícito porque uma falha aqui é silenciosa: a API sobe normalmente e só a
# interface web retorna 404.
include = [{ path = "src/edital_rag/api/estatico/*.html", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
httpx = "^0.28"
ruff = "^0.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
